# Page for the FoundationDB process that is already running.
# This file does not start a database.
services:
  dashboard:
    image: runu/foundationdb-dashboard:7.3.62
    container_name: foundationdb-dashboard
    ports:
      - "127.0.0.1:8090:8080"
    environment:
      PORT: "8080"
      FDB_CONNECTION_STRING: docker:docker@foundationdb:4500
      TREND_FILE: /var/lib/foundationdb-dashboard/trend.json
      CLUSTERS_FILE: /var/lib/foundationdb-dashboard/clusters.json
      AUTH: "on"
      AUTH_USER: "admin"
      AUTH_PASSWORD: "123456"
    volumes:
      - dashboard-trend:/var/lib/foundationdb-dashboard
    networks:
      - foundationdb
    restart: unless-stopped

volumes:
  dashboard-trend:

networks:
  foundationdb:
    external: true
    name: local-foundationdb_default
